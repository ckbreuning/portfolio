name: "<ckb/> Deploy to ckbreuning.com"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: "Ship portfolio-26 to one.com"
    runs-on: ubuntu-latest
    steps:
    - name: "01 · Get the latest code"
      uses: actions/checkout@v6

    - name: "02 · Install lftp"
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: "03 · Upload the theme and mu-plugins"
      env:
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USER: ${{ secrets.SFTP_USER }}
        LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        WP_CONTENT_PATH: ${{ secrets.WP_CONTENT_PATH }}
      run: |
        echo "Host: ${SFTP_HOST:+set} | User: ${SFTP_USER:+set} | Password: ${LFTP_PASSWORD:+set} | Path: ${WP_CONTENT_PATH:+set}"
        lftp -d -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; open -u $SFTP_USER --env-password sftp://$SFTP_HOST; ls; mirror --reverse --verbose --exclude-glob .git* ./themes/portfolio-26/ $WP_CONTENT_PATH/themes/portfolio-26/; mirror --reverse --verbose ./mu-plugins/ $WP_CONTENT_PATH/mu-plugins/"